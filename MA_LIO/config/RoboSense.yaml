# ROS2 parameter file. `/**` matches any node name; keep it unless you set Node name explicitly.
/**:
  ros__parameters:
    # ── formerly launch <param> tags ──
    max_iteration: 3
    filter_size_surf: 0.5
    filter_size_map: 0.5
    cube_side_length: 1000.0
    plane_th: 0.4
    range_min: 0.0
    range_max: 1.0
    map_file_path: ""

    common:
      # Per-sensor topics from realtime_perception (NOT the merged cloud). Edit labels to match.
      lid_topic: ["/perception_node/lidar_107/points", "/perception_node/lidar_108/points"]
      lid_type: [4, 4]            # 1-Livox 2-Velodyne 3-Ouster 4-RoboSense (realtime_perception cloud)
      N_SCANS: [96, 96]           # RoboSense Airy beam count (informational for the handler)
      point_filter_num: [4, 4]
      lid_num: 2
      # SINGLE IMU only — pick ONE of the two; the other is unused by MA-LIO.
      imu_topic: "/perception_node/lidar_107/imu/data"
      time_sync_en: false
      time_offset_lidar_to_imu: 0.0

    preprocess:
      timestamp_unit: 0           # unused by the robosense handler (reads the `time` field in seconds)
      blind: 0.5

    mapping:
      # === IMU noise — RETUNE for your IMU (City-dataset placeholders) ===
      acc_cov: 0.1
      gyr_cov: 0.1
      b_acc_cov: 0.0001
      b_gyr_cov: 0.0001
      fov_degree: 180.0
      det_range: 100.0
      extrinsic_est_en: true
      # Body/reference frame = nav IMU (lidar_nav_imu_corrected); imu_topic feeds 107 = nav.
      # Each block is LiDAR_i -> nav_IMU. Row order matches lid_topic: [0]=nav(107), [1]=mani(108).
      # Row0 = nav: tf2_echo lidar_nav_imu_corrected lidar_nav_corrected.
      # Row1 = mani: tf2_echo lidar_nav_imu_corrected lidar_mani_corrected.
      extrinsic_T: [ 0.004, 0.004, -0.005,
                     0.495, 0.023,  0.704 ]
      # quaternion per LiDAR in (w, x, y, z) order. tf2_echo prints (x,y,z,w) — REORDERED below.
      # Row0 nav:  tf2 xyzw [-0.704, 0.710, -0.005, -0.005]
      # Row1 mani: tf2 xyzw [-0.009, 0.483, -0.004,  0.875]
      extrinsic_R: [ -0.005, -0.704,  0.710, -0.005,
                      0.875, -0.009,  0.483, -0.004 ]
      # Static nav_IMU -> base_link; odometry output is expressed at base_link.
      # tf2_echo lidar_nav_imu_corrected base_link: t below, xyzw [-0.004, 0.966, -0.003, 0.259].
      imu_to_base_T: [-0.175, 0.015, 1.087]
      imu_to_base_R: [0.259, -0.004, 0.966, -0.003]

    publish:
      path_en: true
      scan_publish_en: true
      dense_publish_en: true
      scan_bodyframe_pub_en: true

    pcd_save:
      pcd_save_en: false
      interval: -1

    uncertainty:
      point_cov_max: 0.00125
      point_cov_min: 0.00075
      plane_cov_max: 1.0
      plane_cov_min: 0.8
      localize_cov_max: 2.0
      localize_cov_min: 0.3
      localize_thresh_max: 0.7
      localize_thresh_min: 0.2
    cov_threshold: 0.5
